<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Wedin Tribune — Loading…</title>
    <script>
      // Single Page Apps for GitHub Pages — rafgraph/spa-github-pages
      // Encodes the requested path as a query string, then redirects to
      // index.html so the SPA can read it back and restore the route.
      (function () {
        var pathSegmentsToKeep = 1; // matches /summer-trip/ base path
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
